name: Update Repo Packages

on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:

concurrency:
  group: update-repo-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev zstd

      - name: Generate and push package indexes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          for attempt in 1 2 3 4 5; do
            echo "生成索引（尝试 ${attempt}/5）"

            dpkg-scanpackages --multiversion debs /dev/null > Packages
            sed -i -E 's/^Section:.*$/Section: Tweaks/' Packages
            zstd -f Packages -o Packages.zst

            git add Packages Packages.zst

            if git diff --cached --quiet; then
              echo "索引没有变化"
              exit 0
            fi

            git commit -m "Auto rebuild repo index"

            if git push origin "HEAD:${BRANCH}"; then
              echo "索引推送成功"
              exit 0
            fi

            echo "推送未成功，拉取远程更新后重试"
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
          done

          echo "重试 5 次后仍无法推送"
          exit 1
