name: Update Repo Packages
on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd fakeroot attr

      - name: Repair ALL deb in debs folder (Clear xattr + fix permission)
        run: |
          find debs -maxdepth 1 -name "*.deb" -type f | while read -r deb; do
            [[ -z "$deb" ]] && continue
            echo "===== 正在处理：$deb ====="

            # 清除扩展属性
            setfattr --remove-all "$deb" 2>/dev/null || true

            tmp=$(mktemp -d)

            # 拆包，失败跳过
            fakeroot dpkg-deb -R "$deb" "$tmp" || {
              echo "❌ $deb 解析失败，跳过此包"
              rm -rf "$tmp"
              continue
            }

            # 修复权限
            chmod 755 "$tmp/DEBIAN"
            chmod 644 "$tmp/DEBIAN/control"
            [ -f "$tmp/DEBIAN/preinst" ] && chmod 755 "$tmp/DEBIAN/preinst"
            [ -f "$tmp/DEBIAN/postinst" ] && chmod 755 "$tmp/DEBIAN/postinst"
            [ -f "$tmp/DEBIAN/prerm" ] && chmod 755 "$tmp/DEBIAN/prerm"
            [ -f "$tmp/DEBIAN/postrm" ] && chmod 755 "$tmp/DEBIAN/postrm"

            # 重新打包覆盖原文件
            fakeroot dpkg-deb -b "$tmp" "$deb" || {
              echo "❌ $deb 重新打包失败，跳过此包"
              rm -rf "$tmp"
              continue
            }

            rm -rf "$tmp"
            echo "✅ $deb 处理完成"
          done

      - name: Generate Packages
        run: |
          fakeroot dpkg-scanpackages --multiversion debs /dev/null > Packages.raw
          sed -E 's/^Section:.*$/Section: Tweaks/' Packages.raw > Packages
          zstd -f Packages -o Packages.zst
          rm -f Packages.raw

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add debs/*.deb Packages Packages.zst
          git commit -m "Auto-update: Repair all debs + rebuild index" || echo "No changes to commit"
          # 优先master，适配你的仓库
          git push origin master || git push origin main || echo "Push conflict, skip"
