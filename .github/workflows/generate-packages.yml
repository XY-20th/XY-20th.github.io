name: Update Repo Packages

on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:

concurrency:
  group: update-repo-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev zstd

      - name: Generate package indexes
        run: |
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          sed -i -E 's/^Section:.*$/Section: Tweaks/' Packages
          zstd -f Packages -o Packages.zst

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Packages Packages.zst

          if git diff --cached --quiet; then
            echo "索引没有变化，无需提交"
            exit 0
          fi

          git commit -m "Auto rebuild repo index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
